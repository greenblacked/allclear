name: Release

# Publishes a GitHub Release whose notes are that version's CHANGELOG.md
# section, and creates its vX.Y.Z tag. Ways in:
#   - Run workflow with bump = patch, minor or major: bumps the version and
#     dates the changelog in a commit on main authored by whoever clicked,
#     then tags that commit and publishes. The usual way to release.
#   - Run workflow with bump = current: publishes the package.json version
#     as it is, if it has no tag yet (the first release, or a retry).
#   - Merging a pull request that changes the version in package.json,
#     for example one from scripts/release/bump.sh: tags the merge commit.
#   - Pushing a vX.Y.Z tag by hand.
# The release has to be on main, have a changelog section and pass the same
# checks as CI. If any check fails, nothing is committed, tagged or
# published. CONTRIBUTING.md#releases has the details.

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    # Filters the branch push only. GitHub does not apply paths to tag pushes.
    paths: [package.json]
  workflow_dispatch:
    inputs:
      bump:
        description: 'patch, minor or major bumps the version and releases it; current releases the package.json version as it is'
        type: choice
        options: [current, patch, minor, major]
        default: current

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, branches and tags: main ancestry, the previous
          # package.json and existing tags are all read below.
          fetch-depth: 0

      - name: Decide whether this run releases
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          BUMP: ${{ inputs.bump }}
        run: |
          skip() { echo "::notice::$1"; echo "release=false" >>"$GITHUB_OUTPUT"; exit 0; }

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; only main is released"
            exit 1
          fi

          if [ "$EVENT" = workflow_dispatch ] && [ "$BUMP" != current ]; then
            # A dry run of the bump publish will make: it validates the
            # changelog and the new tag, and its commit is thrown away.
            git config user.name plan
            git config user.email plan@localhost
            ./scripts/release/bump.sh --ci "$BUMP"
            version="$(node -p "require('./package.json').version")"
            echo "tag=v$version" >>"$GITHUB_OUTPUT"
            echo "release=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "$tag" ]; then
              echo "::error::tag $REF_NAME does not match package.json version $version"
              exit 1
            fi
          else
            # A push to main releases only when it changed the version, so a
            # dependency update that touches package.json releases nothing.
            if [ "$EVENT" = push ]; then
              previous="$(git show "$BEFORE:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || true)"
              [ "$previous" != "$version" ] || skip "package.json version is still $version; nothing to release"
            fi
            if existing="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")"; then
              if [ "$existing" != "$GITHUB_SHA" ]; then
                echo "::error::$tag already exists on $existing; run this workflow with bump = patch, minor or major"
                exit 1
              fi
            fi
          fi

          ./scripts/ci/release-notes.sh "$version" >/dev/null
          echo "release=true" >>"$GITHUB_OUTPUT"

  verify:
    name: verify release
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    name: publish release
    needs: [plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job with write access. It installs no dependencies and runs
    # no project code: only the release scripts, npm version and gh.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Kept only when this job has a bump commit to push to main.
          persist-credentials: ${{ github.event_name == 'workflow_dispatch' && inputs.bump != 'current' }}

      - name: Commit the version bump to main
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'current'
        env:
          BUMP: ${{ inputs.bump }}
          TAG: ${{ needs.plan.outputs.tag }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          # Authored by the account that ran the workflow, not a bot.
          git config user.name "$ACTOR"
          git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
          ./scripts/release/bump.sh --ci "$BUMP"
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::bumped to v$version, but plan expected $TAG"
            exit 1
          fi
          # Fails without force if main moved since the run started, so a
          # concurrent merge is never overwritten.
          git push origin "HEAD:refs/heads/main"

      - name: Tag and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          ./scripts/ci/release-notes.sh "${TAG#v}" >"$notes"
          # A re-run updates the existing release instead of failing on it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Status Bar $TAG" --notes-file "$notes"
          else
            # Creates the tag on HEAD: the bump commit, or the commit this
            # run was started for. A tag pushed by hand already points there
            # and is used as it is. Neither the tag nor a bump pushed with
            # GITHUB_TOKEN starts this workflow again.
            gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "Status Bar $TAG" --notes-file "$notes"
          fi
