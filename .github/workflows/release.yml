name: Release

# Pushing a vMAJOR.MINOR.PATCH tag publishes a GitHub Release whose notes are
# that version's CHANGELOG.md section. The tag has to match package.json,
# point at a commit on main, and pass the same checks as CI. If any check
# fails, nothing is published. CONTRIBUTING.md#releases has the steps.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and branches, so the tag can be checked against main.
          fetch-depth: 0

      - name: Check tag, version and notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main"
            exit 1
          fi
          ./scripts/ci/release-notes.sh "$version" >/dev/null

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    name: publish release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job with write access. It runs no npm install and no project
    # code, only the notes script and the preinstalled gh CLI.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          ./scripts/ci/release-notes.sh "${TAG#v}" >"$notes"
          # A re-run updates the existing release instead of failing on it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Status Bar $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --verify-tag --title "Status Bar $TAG" --notes-file "$notes"
          fi
