name: Release

# Publishes a GitHub Release whose notes are that version's CHANGELOG.md
# section. Three ways in:
#   - merging a pull request from scripts/release/bump.sh, which changes the
#     version in package.json: this workflow tags the merge commit
#   - pushing a vMAJOR.MINOR.PATCH tag by hand
#   - Run workflow on main, for a package.json version with no tag yet
# The release has to be on main, have a changelog section and pass the same
# checks as CI. If any check fails, nothing is tagged or published.
# CONTRIBUTING.md#releases has the steps.

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    # Filters the branch push only. GitHub does not apply paths to tag pushes.
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, branches and tags: main ancestry, the previous
          # package.json and existing tags are all read below.
          fetch-depth: 0

      - name: Decide whether this run releases
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          skip() { echo "::notice::$1"; echo "release=false" >>"$GITHUB_OUTPUT"; exit 0; }

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; only main is released"
            exit 1
          fi

          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "$tag" ]; then
              echo "::error::tag $REF_NAME does not match package.json version $version"
              exit 1
            fi
          else
            # A push to main releases only when it changed the version, so a
            # dependency update that touches package.json releases nothing.
            if [ "$EVENT" = push ]; then
              previous="$(git show "$BEFORE:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || true)"
              [ "$previous" != "$version" ] || skip "package.json version is still $version; nothing to release"
            fi
            if existing="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")"; then
              if [ "$existing" != "$GITHUB_SHA" ]; then
                echo "::error::$tag already exists on $existing; bump to a new version with scripts/release/bump.sh"
                exit 1
              fi
            fi
          fi

          ./scripts/ci/release-notes.sh "$version" >/dev/null
          echo "release=true" >>"$GITHUB_OUTPUT"
          echo "Releasing $tag from $GITHUB_SHA"

  verify:
    name: verify release
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    name: publish release
    needs: [plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job with write access. It runs no npm install and no project
    # code, only the notes script and the preinstalled gh CLI.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          ./scripts/ci/release-notes.sh "${TAG#v}" >"$notes"
          # A re-run updates the existing release instead of failing on it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Status Bar $TAG" --notes-file "$notes"
          else
            # Creates the tag on this commit when it does not exist yet. A
            # tag pushed by hand already points here and is used as it is.
            # A tag created with GITHUB_TOKEN does not start this workflow
            # again.
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Status Bar $TAG" --notes-file "$notes"
          fi
