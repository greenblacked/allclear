version: 2
updates:
  # Version updates land on dev with the rest of the work, and reach main
  # with the next merge from dev. Security updates ignore target-branch and
  # open against the default branch, without the groups and ignores below;
  # a merge into main reaches dev through release.yml's sync.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    ignore:
      # Node types must match the oldest supported runtime (engines and
      # .nvmrc), or typecheck accepts APIs that fail at runtime on it. Move
      # this major by hand together with engines.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
